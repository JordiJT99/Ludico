name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: ludico
          POSTGRES_PASSWORD: ludico
          POSTGRES_USER: ludico
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ludico -d ludico"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ludico/database db:migrate
        env:
          DATABASE_URL: postgresql://ludico:ludico@localhost:5432/ludico
      - run: pnpm security:check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check

  containers:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target api --tag ludico-api:ci .
      - name: Smoke test API container
        run: |
          docker run -d --name ludico-api-ci -p 4000:4000 \
            -e DATABASE_URL=postgresql://ludico:ludico@127.0.0.1:5432/ludico \
            -e ADMIN_API_KEY=01234567890123456789012345678901 \
            ludico-api:ci
          for attempt in {1..10}; do
            if curl --fail --silent --show-error http://127.0.0.1:4000/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs ludico-api-ci
          exit 1
      - if: always()
        run: docker rm --force ludico-api-ci || true
      - run: docker build --target worker --tag ludico-worker:ci .
      - run: docker build --target web --tag ludico-web:ci .
      - name: Smoke test web container
        run: |
          docker run -d --name ludico-web-ci -p 3000:3000 \
            -e PUBLIC_API_URL=http://127.0.0.1:4000 \
            ludico-web:ci
          for attempt in {1..10}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/robots.txt; then
              exit 0
            fi
            sleep 1
          done
          docker logs ludico-web-ci
          exit 1
      - if: always()
        run: docker rm --force ludico-web-ci || true
