name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: ludico
          POSTGRES_PASSWORD: ludico
          POSTGRES_USER: ludico
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ludico -d ludico"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ludico/database db:migrate
        env:
          DATABASE_URL: postgresql://ludico:ludico@localhost:5432/ludico
      - run: pnpm security:check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check

  containers:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target api --tag ludico-api:ci .
      - run: docker build --target worker --tag ludico-worker:ci .
      - run: docker build --target web --tag ludico-web:ci .
