<!-- No BottomNavBar rendered as per UX Goal: Focused Task suppresses global navigation -->
<script>
        // Micro-interaction for keyboard
        const keys = document.querySelectorAll('.active-letter');
        keys.forEach(key => {
            key.addEventListener('touchstart', () => {
                key.classList.add('bg-surface-container-highest', 'scale-95');
            });
            key.addEventListener('touchend', () => {
                key.classList.remove('bg-surface-container-highest', 'scale-95');
            });
        });

        // Toggle Grid Focus logic (Visual Only)
        const cells = document.querySelectorAll('.grid-cell:not(.bg-primary)');
        cells.forEach(cell => {
            cell.addEventListener('click', () => {
                cells.forEach(c => c.classList.remove('active-focus'));
                cell.classList.add('active-focus');
            });
        });
